<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="CORIANCHIC"/>
<meta name="application-name" content="CORIANCHIC"/>
<meta name="theme-color" content="#1b7a4e"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>CORIANCHIC</title>
<link href="https:&#47;&#47;fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f0;--ink:#12261c;--muted:#5a6d62;--line:#d3ddd6;--green:#1b7a4e;--green-d:#145c3a;--m:#009655;--i:#e8890a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Assistant,"Segoe UI","Arial Hebrew",Arial,sans-serif;direction:rtl;overflow:hidden}
.app{max-width:none;width:100%;margin:0;padding:8px 16px 10px;height:100%;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-sizing:border-box}
#main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#main.scroll-main{overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
#main.cal-fill{overflow:hidden;display:flex;flex-direction:column}
.cal-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.cal-wd-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:0 0 auto}
.cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(0,1fr);gap:3px}
.cal-cell{background:#fff;border:1px solid #111;border-radius:2px;padding:4px;overflow:hidden;min-height:0}
.cal-month .cal-cell{overflow:hidden;border-radius:2px}
.cal-cell.week{overflow:auto}
.cal-cell b{font-size:12px;display:block}
.cal-ev{font-size:13px;margin-top:4px;padding:5px 6px;border-radius:8px;line-height:1.3;cursor:pointer;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.day-slot{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 6px;background:#fff;box-sizing:border-box}
.day-h{width:54px;flex:0 0 54px;font-weight:800;padding-top:6px}
.day-evs{flex:1;min-width:0}
.day-evs .cal-ev{margin-top:0;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-drop{height:32px;margin:6px 0;border:1px dashed #145c3a;border-radius:8px;background:#e8f6ee}
.cal-ev.ghost{opacity:.35}
.cal-week .cal-ev{white-space:normal;overflow:visible;font-size:14px}
.cal-month .cal-ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev.m{background:#d9efe3;color:#145c3a}
.cal-ev.i{background:#ffd0a8;color:#9a3b00}
.cal-wd{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px 0}
.pane-head{flex:0 0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex:0 0 auto}
.top .kpis{flex:1;justify-content:center;margin:0;flex-wrap:nowrap}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--green),#2db36b);color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:18px;margin:0}
.muted{color:var(--muted);font-size:12px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px;background:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:#e6f6ee;border-color:var(--green);color:var(--green-d)}
.kpis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:11px;font-weight:800;cursor:pointer;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;text-align:center}
.kpi.on{border-color:var(--green);background:#e6f6ee;color:var(--green-d)}
.kpi b{margin:0;font-size:16px;line-height:1}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;flex:1;min-height:0}
table{width:100%;min-width:1200px;border-collapse:collapse;table-layout:fixed}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
th{color:#3d4f46;font-size:13px;font-weight:800;position:sticky;top:0;background:#e4ece7;padding:12px 8px;z-index:2}
col.c-fold{width:52px} col.c-name{width:180px} col.c-tel{width:120px} col.c-note{width:200px}
col.c-ag{width:90px} col.c-st{width:210px} col.c-pay{width:110px} col.c-dt{width:90px} col.c-ed{width:120px}
tr:hover td{background:#f6fbf8;cursor:pointer}
.cards{display:none;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.badge{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.s-הזמנה{background:#b9e4f5;color:#1a4f66}
.s-מדידה{background:#f7c6c6;color:#8a2a2a}
.s-שרטוט{background:#8b1c1c;color:#fff}
.s-ממתין{background:#bfe3b6;color:#2a5c32}
.s-CAM{background:#2b4d9b;color:#fff}
.s-ייצור{background:#e6e6e6;color:#555}
.s-מוכן{background:#1f6b3a;color:#fff}
.s-הותקן{background:#e0c6ef;color:#5a3478}
.s-גמר{background:#3a3a3a;color:#fff}
.s-שירות{background:#ececec;color:#444}
.p-שולם{background:#dcfce7;color:#166534}
.p-חלקי{background:#ffedd5;color:#9a3412}
.p-לא{background:#fee2e2;color:#991b1b}
.navd{display:flex;gap:2px;background:#f3f6f4;border:1px solid var(--line);border-radius:0;padding:0 4px;margin:0 -12px 12px;overflow:auto;flex:0 0 auto}
.navd button{border:0;background:transparent;padding:12px 14px;border-radius:0;font-weight:700;font-size:15px;letter-spacing:0;color:#4a5c52;cursor:pointer;font-family:inherit}
.navd button.on{background:#fff;color:var(--green-d);box-shadow:inset 0 -3px 0 var(--green)}
.bottom{display:none;position:fixed;bottom:0;right:0;left:0;background:#f3f6f4;border-top:1px solid var(--line)}
.bottom button{flex:1;border:0;background:0;padding:12px 0 16px;font-weight:700;font-size:13px;color:#4a5c52;font-family:inherit}
.bottom button.on{color:var(--green-d);background:#fff}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(16,24,20,.45);z-index:20;padding:10px;padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));overflow:hidden;align-items:stretch;justify-content:center;box-sizing:border-box}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:none;max-height:100%;height:100%;margin:0;padding:0;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box}
.modal h2{margin:0 0 4px;font-size:20px;line-height:1.25;word-break:break-word}
.ask-ov{position:fixed;inset:0;background:rgba(16,24,20,.5);z-index:95;display:flex;align-items:center;justify-content:center;padding:22px;box-sizing:border-box}
.ask-box{background:#fff;border-radius:18px;padding:20px 18px 16px;max-width:380px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.ask-box p{margin:0 0 16px;font-size:16px;font-weight:700;line-height:1.4}
.ask-box input{margin-bottom:12px}
.ask-btns{display:flex;gap:8px}
.ask-btns .btn{flex:1;min-height:44px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.modal textarea{min-height:56px;max-height:72px;resize:none}
#evNote{max-height:none!important;min-height:120px;overflow:hidden}
th.c-st,td.c-st{text-align:center}
.st-nav{display:grid;grid-template-columns:28px 140px 28px;align-items:center;justify-content:center;gap:4px;direction:ltr;margin:0 auto;width:176px}
.st-nav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:800;line-height:1;padding:0}
.st-nav .badge{min-width:140px;justify-content:center;display:inline-flex}
.files-box{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;min-height:46vh;flex:1}
.files-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-height:52vh;overflow:auto}
.prod-gal{flex:1;min-height:0;overflow:auto}
.prod-gal .files-box{flex:none!important;min-height:0!important;height:auto!important;max-height:none!important;margin:0;padding:0;border-top:0;overflow:visible!important}
.prod-gal .files-thumbs{max-height:none!important;height:auto!important;overflow:visible!important;flex:none!important}
.file-th{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;cursor:pointer;text-align:center}
.file-th.on{outline:2px solid var(--green);border-color:var(--green)}
.addr-line{font-size:16px!important;font-weight:700;color:#1a1a1a;line-height:1.35}
.file-pdf{height:180px;border-radius:8px;background:#3b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;gap:8px}
.file-pdf b{background:#e53935;color:#fff;border-radius:6px;padding:4px 10px;font-size:18px;letter-spacing:.04em}
.file-pdf small{color:#ffcdd2;font-size:12px;font-weight:700}
.file-th img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#eef2f0;display:block}
.file-th .pdf-mark{position:absolute;bottom:28px;left:10px;background:#e53935;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px}
.file-th em{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-th .fchk{position:absolute;top:8px;left:8px;width:18px;height:18px;z-index:2}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb .lb-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:52px 48px 24px;box-sizing:border-box;overflow:hidden;position:relative}
#lb .lb-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .32s ease}
#lb img{max-width:92vw;max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:8px;background:#111;display:block}
#lb iframe{width:min(92vw,820px);height:82vh;border:0;border-radius:8px;background:#fff}
#lb .lb-x{position:absolute;top:10px;left:10px;background:transparent;color:#fff;border:0;width:40px;height:40px;font-size:28px;cursor:pointer;font-weight:700;z-index:2}
#lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:transparent;color:#fff;border:0;width:36px;height:72px;font-size:34px;cursor:pointer;font-weight:300;line-height:1;opacity:.85;z-index:2}
#lb .lb-prev{right:4px} #lb .lb-next{left:4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px;min-height:60px;cursor:pointer}
.act svg{width:22px;height:22px}
.act em{font-style:normal;font-size:10px;font-weight:800;color:var(--green-d)}
.tel{color:var(--green-d);font-weight:800;text-decoration:none;direction:ltr}
.editcell{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
.ico{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;display:inline-grid;place-items:center;text-decoration:none}
.ico svg{width:16px;height:16px}
.ico.pc{background:#fff4cc;border-color:#e6a800}
.fold-cell{display:inline-flex;gap:4px;align-items:center}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px;font-family:inherit;font-size:16px}
label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin:4px 0 2px}
button,.btn{font-family:inherit}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;cursor:pointer;background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn svg{width:22px;height:22px;display:block;flex-shrink:0}
.sel-badge{width:auto;min-width:120px;border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;flex:0 0 auto;background:#fff;padding:14px 16px;padding-top:max(14px, env(safe-area-inset-top, 0px));border-bottom:1px solid var(--line);box-sizing:border-box}
.card-actions{display:flex;gap:8px;flex-shrink:0}
.card-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px;display:flex;flex-direction:column;box-sizing:border-box}
.card-split{display:flex;flex-direction:row;direction:ltr;flex:1;min-height:0;height:100%}
.card-files{width:34%;min-width:240px;max-width:34%;overflow:auto;border-right:1px solid var(--line);padding:12px;direction:rtl;box-sizing:border-box}
.card-form{width:66%;flex:1;overflow:auto;padding:12px 16px;direction:rtl;box-sizing:border-box}
.card-files .files-box{min-height:0;height:auto;margin:0;padding:0;border-top:0}
.card-files .files-thumbs{max-height:none;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.card-files .file-th img,.card-files .file-pdf{height:100px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#145c3a;color:#fff;padding:8px 14px;border-radius:999px;display:none;z-index:30;font-weight:800}
@media(max-width:800px){
  .table-wrap,.navd,.ico.pc{display:none}
  .cards,.bottom{display:flex}
  .app{padding:8px 8px 72px}
  .cards{flex:1;min-height:0;overflow:auto}
  .top{flex-wrap:wrap;align-items:center}
  .top .kpis{flex:1 1 100%;order:3;justify-content:stretch;flex-wrap:nowrap;gap:4px;margin:8px 0 4px;overflow-x:auto}
  .kpi{flex:1;min-width:0;padding:6px 4px;font-size:10px}
  .kpi b{font-size:14px}
  .overlay{overflow:hidden;align-items:stretch;padding:10px;padding-bottom:max(10px, env(safe-area-inset-bottom))}
  .modal{width:100%;height:100%;max-height:none;overflow:hidden;border-radius:16px}
  .files-thumbs{grid-template-columns:repeat(2,1fr);max-height:none}
  .file-th img,.file-pdf{height:28vw;min-height:88px;max-height:120px}
  .card-split{flex-direction:column}
  .card-form{order:1;flex:1 1 auto;overflow:visible;padding:8px 0}
  .card-files{order:2;width:100%;max-width:none;min-width:0;max-height:38vh;overflow:auto;border-right:0;border-top:1px solid var(--line);padding:8px 0 16px;flex:0 0 auto}
  .card-files .files-thumbs{grid-template-columns:repeat(3,1fr)}
  .card-files .file-th img,.card-files .file-pdf{height:18vw;min-height:64px;max-height:88px}
  .prod-gal{padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px))!important;overflow:auto!important}
  .prod-gal .files-thumbs{grid-template-columns:repeat(2,1fr);padding-bottom:40px;max-height:none!important}
  .prod-gal .file-th img,.prod-gal .file-pdf{height:36vw;min-height:110px;max-height:180px}
  .prod-gal .file-th em{white-space:normal;overflow:visible;text-overflow:unset;line-height:1.2;margin-bottom:6px}
  .card-files,.card-form{width:100%;max-width:none;min-width:0}
  .g3,.g2{grid-template-columns:1fr}
  .card-actions{width:100%;order:-1;justify-content:flex-end}
  .sel-badge{min-width:0;flex:1}
  .cards .st-nav{display:flex;width:100%;max-width:none;margin:8px 0;box-sizing:border-box}
  .cards .st-nav .badge{flex:1;min-width:0;width:auto}
  .card-head{padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top))}
  .card-body{overflow:auto;padding:12px 16px 88px}
  .addr-line{white-space:normal;word-break:break-word;padding:0 2px}
  .acts{margin:10px 0;gap:6px}
  .file-th{margin:0}
  .prod-day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px}
  .prod-day b{display:block;margin-bottom:8px;font-size:15px}
  .prod-day .cal-ev{white-space:normal;font-size:15px;line-height:1.35}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>CORIANCHIC</h1>
      <div class="muted" id="sub">טוען…</div>
    </div>
    <div class="kpis" id="topKpi"></div>
    <div class="logo">C</div>
  </div>
  <div class="navd" id="navd"></div>
  <div id="main"></div>
</div>
<div class="bottom" id="navm"></div>
<div class="overlay" id="ov"><div class="modal" id="md"></div></div>
<div id="lb"></div>
<div class="toast" id="toast"></div>
<script>
const API = ["https:","","script.google.com/macros/s/AKfycbwC43xEgPqDoU8O9uxDAPkVxOqf3-nuxZNdnb53yYgnnjAWDdX41MwhLmQUetaaIzoU/exec"].join("/");
const IMPORT_URL = API + "?action=db";
const DB_NAME = "corianchic";
const STATUSES = ["הזמנה","מדידה","שרטוט","ממתין לאישור","CAM","ייצור","מוכן","הותקן/ גבייה","גמר","שירות"];
const ORDER = "הזמנה";
const ARCH = ["גמר"];
let state = {view:localStorage.getItem("cc_view")||"board", role:localStorage.getItem("cc_role")||"", worker:localStorage.getItem("cc_worker")||"", rows:[], agents:[], installers:[], production:[], settings:{}, history:[], roles:{officePin:"0000",installerPin:"1111",prodPin:"2222"}, q:"", showOrders:false, showArch:false, filterStatus:"", imported:false};

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function ask(msg, yes="כן", no="לא"){
  return new Promise(res=>{
    const w=document.createElement("div");
    w.className="ask-ov";
    w.innerHTML=`<div class="ask-box"><p>${esc(msg)}</p><div class="ask-btns"><button type="button" class="btn" data-y>${esc(yes)}</button><button type="button" class="btn ghost" data-n>${esc(no)}</button></div></div>`;
    document.body.appendChild(w);
    w.querySelector("[data-y]").onclick=()=>{w.remove(); res(true)};
    w.querySelector("[data-n]").onclick=()=>{w.remove(); res(false)};
  });
}
function askInput(msg, def=""){
  return new Promise(res=>{
    const w=document.createElement("div");
    w.className="ask-ov";
    w.innerHTML=`<div class="ask-box"><p>${esc(msg)}</p><input id="askIn" value="${esc(def)}"><div class="ask-btns"><button type="button" class="btn" data-y>אישור</button><button type="button" class="btn ghost" data-n>ביטול</button></div></div>`;
    document.body.appendChild(w);
    const inp=w.querySelector("#askIn");
    setTimeout(()=>inp.focus(),50);
    w.querySelector("[data-y]").onclick=()=>{const v=inp.value.trim(); w.remove(); res(v)};
    w.querySelector("[data-n]").onclick=()=>{w.remove(); res("")};
  });
}
function askPick(msg, opts){
  return new Promise(res=>{
    const w=document.createElement("div");
    w.className="ask-ov";
    const btns=(opts||[]).map((o,i)=>`<button type="button" class="btn ${i?"ghost":""}" data-i="${i}">${esc(o.label)}</button>`).join("");
    w.innerHTML=`<div class="ask-box"><p>${esc(msg)}</p><div class="ask-btns" style="flex-direction:column">${btns}<button type="button" class="btn ghost" data-x>ביטול</button></div></div>`;
    document.body.appendChild(w);
    w.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i; w.remove(); res(opts[i].value)});
    w.querySelector("[data-x]").onclick=()=>{w.remove(); res("")};
  });
}
function openIdb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv")};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}

function parseUpdated(s){
  if(!s) return "";
  const d=new Date(s);
  if(!isNaN(d)) return fmtDT(d);
  return String(s);
}
function fmtDT(d){
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDay(s){
  if(!s) return "";
  const str=String(s);
  const he=str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(he) return `${he[1].padStart(2,"0")}/${he[2].padStart(2,"0")}/${he[3]}`;
  const iso=str.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  const d=new Date(s);
  if(isNaN(d)) return str.slice(0,10);
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
}

let _gsBridge=null;
function gsBridgeFrame(){
  if(_gsBridge&&_gsBridge.contentWindow) return Promise.resolve(_gsBridge);
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej(new Error("bridge-timeout")),15000);
    const f=document.createElement("iframe");
    f.setAttribute("title","gs");
    f.style.cssText="position:fixed;width:1px;height:1px;opacity:0;left:-20px;top:-20px;border:0;pointer-events:none";
    const on=ev=>{
      if(!(ev.data&&ev.data.bridge==="ready")) return;
      window.removeEventListener("message",on);
      clearTimeout(t);
      _gsBridge=f;
      res(f);
    };
    window.addEventListener("message",on);
    f.src=API+"?action=bridge";
    document.body.appendChild(f);
  });
}
function runGS(name, arg, ms){
  return new Promise((res,rej)=>{
    if(typeof google!=="undefined" && google.script && google.script.run){
      const t=setTimeout(()=>rej(new Error("gs-timeout")), ms||20000);
      const r=google.script.run.withSuccessHandler(v=>{clearTimeout(t);res(v)}).withFailureHandler(e=>{clearTimeout(t);rej(e)});
      try{ if(arg===undefined) r[name](); else r[name](arg); }
      catch(err){ clearTimeout(t); rej(err); }
      return;
    }
    if(/github\.io$/i.test(location.hostname||"")){
      gsBridgeFrame().then(f=>{
        const id="b"+Date.now()+Math.random().toString(36).slice(2);
        const t=setTimeout(()=>rej(new Error("gs-timeout")), ms||20000);
        const on=ev=>{
          if(!ev.data||ev.data.id!==id) return;
          window.removeEventListener("message",on);
          clearTimeout(t);
          if(ev.data.ok) res(ev.data.v);
          else rej(new Error(ev.data.error||"bridge"));
        };
        window.addEventListener("message",on);
        f.contentWindow.postMessage({id,name,arg},"*");
      }).catch(rej);
      return;
    }
    const q=API+"?action="+encodeURIComponent(name)+"&payload="+encodeURIComponent(JSON.stringify(arg||{}));
    fetchTo(q, ms||20000).then(res).catch(rej);
  });
}
async function trashFolderOnDrive(url){
  if(!url) return {ok:true};
  try{
    const out=await runGS("apiDeleteFolder",{folderUrl:url});
    if(out&&out.ok) return out;
  }catch(e){}
  try{
    const q=API+"?action=trashFolder&folderUrl="+encodeURIComponent(url);
    const out=await fetchTo(q,20000);
    if(out&&out.ok) return out;
    return out||{ok:false};
  }catch(e){
    return {ok:false,error:String(e&&e.message||e)};
  }
}
function fetchTo(url, ms){
  return Promise.race([
    fetch(url).then(r=>r.json()),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error("fetch-timeout")), ms))
  ]);
}

      }
    }catch(e){}
  }

}
function openLightbox(files, i){
  const list=(files||[]).filter(isShowFile);
  if(!list.length) return;
  let n=Math.max(0, Math.min(i||0, list.length-1));
  const box=document.getElementById("lb");
  let x0=0;
  let moving=false;
  const close=()=>{ box.className=""; box.innerHTML=""; box.ontouchstart=null; box.ontouchend=null; };
  const bindNav=()=>{
    const x=box.querySelector(".lb-x"); if(x) x.onclick=e=>{e.stopPropagation(); close();};
    const p=box.querySelector(".lb-prev"); if(p) p.onclick=e=>{e.stopPropagation(); step(-1);};
    const nx=box.querySelector(".lb-next"); if(nx) nx.onclick=e=>{e.stopPropagation(); step(1);};
  };
  const makeSlide=async(f, fromPct)=>{
    const sl=document.createElement("div");
    sl.className="lb-slide";
    sl.style.transform="translateX("+fromPct+"%)";
    const img=document.createElement("img");
    img.alt="";
    img.src=f.thumb||"";
    sl.appendChild(img);
    const stage=box.querySelector(".lb-stage");
    if(stage) stage.appendChild(sl);
    const src=await photoSrc(f);
    if(src) img.src=src;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ sl.style.transform="translateX(0)"; }));
    return sl;
  };
  const step=async dir=>{
    if(moving||list.length<2) return;
    moving=true;
    n=(n+dir+list.length)%list.length;
    const stage=box.querySelector(".lb-stage");
    const old=[...box.querySelectorAll(".lb-slide")];
    old.forEach(sl=>{ sl.style.transform="translateX("+(-dir*100)+"%)"; });
    await makeSlide(list[n], dir*100);
    setTimeout(()=>{ old.forEach(sl=>sl.remove()); moving=false; }, 340);
  };
  const draw=async()=>{
    const f=list[n];
    box.className="on";
    box.innerHTML=`<button class="lb-x" type="button">×</button>
      <button class="lb-nav lb-prev" type="button">‹</button>
      <button class="lb-nav lb-next" type="button">›</button>
      <div class="lb-stage"></div>`;
    bindNav();
    await makeSlide(f, 0);
  };
  box.onclick=e=>{ if(e.target===box || (e.target.classList&&e.target.classList.contains("lb-stage"))) close(); };
  box.ontouchstart=e=>{ x0=e.changedTouches[0].clientX; };
  box.ontouchend=e=>{
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)<55) return;
    step(dx>0?-1:1);
  };
  draw();
}

function b64ToFile(b64, name, mime){
  const bin=atob(b64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], name||"file", {type:mime||"application/octet-stream"});
}
function isSendName(name){
  const n=String(name||"").toLowerCase();
  return /\.(jpe?g|png|gif|webp|heic|heif|bmp|pdf)$/.test(n);
}
function guessMime(name){
  const n=String(name||"").toLowerCase();
  if(n.endsWith(".pdf")) return "application/pdf";
  if(n.endsWith(".png")) return "image/png";
  if(n.endsWith(".gif")) return "image/gif";
  if(n.endsWith(".webp")) return "image/webp";
  if(/\.(jpe?g)$/.test(n)) return "image/jpeg";
  return "application/octet-stream";
}

async function ensureDirPerm(handle){
  if(!handle) return false;
  const q={mode:"read"};
  try{
    if((await handle.queryPermission(q))==="granted") return true;
    return (await handle.requestPermission(q))==="granted";
  }catch(e){ return false; }
}
function pickViaInput(opts){

async function clientDirHandle(r){
  const root=await loadLocalActive();
  if(!root || !await ensureDirPerm(root)) return null;
  const want=String((r&&r.name)||"").trim();
  if(!want) return null;
  try{ return await root.getDirectoryHandle(want); }catch(e){}
  try{
    for await (const [name, ent] of root.entries()){
      if(ent.kind==="directory" && name.replace(/\s+/g," ")===want.replace(/\s+/g," ")) return ent;
    }
  }catch(e){}
  return root;
}
function inClientPath(file, want){
  if(!isSendName(file.name)) return false;
  if(!want) return true;
  const p=String(file.webkitRelativePath||file.name).replace(/\\/g,"/");
  const parts=p.split("/").filter(Boolean);
  const w=want.replace(/\s+/g," ").trim();
  return parts.some(x=>x.replace(/\s+/g," ").trim()===w) || p.indexOf(want)>=0;
}
async function pickFilesFromClientFolder(r){
  const want=String((r&&r.name)||"").trim();
  const dir=await clientDirHandle(r);
  if(dir && dir.name && want && dir.name.replace(/\s+/g," ")===want.replace(/\s+/g," ")){
    try{
      const files=[];
      for await (const [,ent] of dir.entries()){
        if(ent.kind!=="file") continue;
        if(!isSendName(ent.name)) continue;
        files.push(await ent.getFile());
      }
      if(files.length) return files;
    }catch(e){}
  }
  toast("בחלון בחרו את תיקיית הלקוח: "+(want||""));
  const picked=await pickViaInput({dir:true});
  if(!picked.length) return [];
  const only=picked.filter(f=>inClientPath(f, want));
  if(only.length) return only;
  return picked.filter(f=>isSendName(f.name));
}

function uniqueSendName(file, i){
  const raw=String(file&&file.name||"file").replace(/[\\/:*?"<>|]+/g,"_");
  return String(i+1)+"-"+Date.now()+"-"+raw;
}
function saveBlindFile(file){
  const name=(file.name||"file")+".ccbin";
  const raw=new File([file], name, {type:"application/octet-stream"});

async function pullDriveFiles(sel){
  const out=[];
  for(const f of sel){
    toast("מוריד · "+(f.name||""));
    let d=null;
    try{ d=await runGS("apiGetFile",{fileId:f.id},60000); }catch(e){ d=null; }
    if(!d||!d.ok||!d.data) throw new Error((d&&d.error)||f.name||"file");
    out.push(b64ToFile(d.data, d.name||f.name, d.mime));
  }
  return out;
}
async function tryShare(pack){
  if(!navigator.share) return "no";
  try{
    if(pack.files && navigator.canShare && !navigator.canShare(pack)){
      if(pack.files.length>1){
        for(const f of pack.files){
          const one={files:[f], title:pack.title, text:pack.text};
          if(!navigator.canShare || navigator.canShare(one)) await navigator.share(one);
          else return "no";
        }
        return "shared";
      }
      return "no";
    }
    await navigator.share(pack);
    return "shared";
  }catch(e){
    if(String(e&&e.name)==="AbortError") return "abort";
    return "no";
  }
}
async function shareViaWhatsApp(files, tel, caption){
  let mode=await tryShare({files:files, title:"CORIANCHIC", text:caption||""});
  if(mode==="no") mode=await tryShare({files:files, title:"CORIANCHIC"});
  if(mode==="shared"||mode==="abort") return mode;
  files.forEach(saveLocalFile);
  return "download";
}

      const pack=files.map((f,i)=>new File([f], uniqueSendName(f,i), {type:f.type||"application/octet-stream"}));
      pack.forEach(saveBlindFile);

  if(navigator.canShare && navigator.canShare({files:files})){
    if(!await ask("לשתף ל-Gmail? שליחה ידנית.","המשך","ביטול")) return;

    catch(e){ if(String(e&&e.name)==="AbortError") return; }

function keepTime(oldStamp, day){

}
function applyCalMove(payload, day, hour){
  if(!payload||!day) return;
  const stamp=hour?(day+" "+hour):keepTime(payload.start, day);
  if(payload.g){
    const iso=day.split("/").reverse().join("-")+"T"+(stamp.match(/(\d{1,2}:\d{2})/)||["","09:00"])[1];
    runGS("apiCalMove",{eventId:payload.id, start:iso}).catch(()=>{});
    (state.gcal||[]).forEach(e=>{ if(e.id===payload.id) e.start=stamp; });
    return;
  }
  const r=state.rows.find(x=>x.id===payload.id);
  if(!r) return;
  const old=payload.start;
  if(payload.kind==="m" && r.measure===old) r.measure=stamp;
  else if(payload.kind==="i" && r.install===old) r.install=stamp;
  else (r.extraDates||[]).forEach(x=>{ if(x.start===old) x.start=stamp; });
  r.updated=fmtDT(new Date());
  saveLocal();
}

function cardDates(r, kind){

  const out=[];
  if(r[field]) out.push({start:r[field], eid:r[ekey]||"", kind});
  (r.extraDates||[]).forEach(x=>{
    const k=x.kind==="measure"||x.kind==="m"?"m":(x.kind==="install"||x.kind==="i"?"i":"");
    if(k===kind && x.start && x.start!==r[field]) out.push({start:x.start, eid:x.eid||"", kind});
  });

}
function unlinkEventFromCards(p){
  const same=s=>s && (s===p.start || String(s)===String(p.start));
  let hit=null;
  state.rows.forEach(r=>{
    const drop=kind=>{
      const field=kind==="m"?"measure":"install";
      const ekey=kind==="m"?"measureEid":"installEid";
      let ch=false;
      if((p.id && r[ekey]===p.id) || same(r[field])){
        r[field]=""; r[ekey]="";
        if(kind==="m") r.noteM=""; else r.noteI="";
        ch=true;
      }
      const n0=(r.extraDates||[]).length;
      r.extraDates=(r.extraDates||[]).filter(x=>{
        const k=x.kind==="measure"||x.kind==="m"?"m":"i";
        if(k!==kind) return true;
        if(p.id && x.eid===p.id) return false;
        if(same(x.start)) return false;
        return true;
      });
      if(ch && !r[field]){
        const nxt=(r.extraDates||[]).find(x=>(x.kind==="measure"||x.kind==="m"? "m":"i")===kind);
        if(nxt){
          r[field]=nxt.start; r[ekey]=nxt.eid||"";
          r.extraDates=r.extraDates.filter(x=>x!==nxt);
        }
      }
      if(ch || (r.extraDates||[]).length!==n0) hit=r;
    };
    if(p.kind!=="i") drop("m");
    if(p.kind!=="m") drop("i");
  });
  return hit;
}

      const here=ev.filter(e=>fmtDay(e.start)===key);
      if(!here.length) continue;
      list+=`<div class="prod-day"><b>${wd[i]} · ${key}</b>${here.map(evLine).join("")}</div>`;
    }
    return `<div class="cal-wrap" style="overflow:auto">${bar}${list||`<div class="card">אין התקנות בשבוע זה</div>`}</div>`;
  }
  let cells="";
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const key=fmtDay(d);
    const here=ev.filter(e=>fmtDay(e.start)===key);
    cells+=`<div class="cal-cell week"><b>${wd[i]} ${key}</b>${here.map(evLine).join("")}</div>`;
  }
  return `<div class="cal-wrap">${bar}<div class="cal-grid cal-week">${cells}</div></div>`;
}
function instOwnEvents(){
  const w=state.worker||"";
  const today=fmtDay(new Date());
  const out=[];
  state.rows.forEach(r=>{
    const push=(kind,start)=>{
      if(!start) return;
      const who=kind==="m"?r.whoMeasure:r.whoInstall;
      if(w && who && who!==w) return;
      if(w && !who) return;
      if(fmtDay(start)<today) return;
      out.push({kind,start,r});
    };
    push("m",r.measure); push("i",r.install);
    (r.extraDates||[]).forEach(x=>push(x.kind==="install"||x.kind==="i"?"i":"m", x.start));
  });
  out.sort((a,b)=>fmtDay(a.start).split("/").reverse().join("")>fmtDay(b.start).split("/").reverse().join("")?1:-1);
  return out;
}
function renderInst(){
  const ev=instOwnEvents();
  const by={};
  ev.forEach(e=>{(by[fmtDay(e.start)]=by[fmtDay(e.start)]||[]).push(e)});
  const days=Object.keys(by);
  if(!days.length) return `<div class="card">אין אירועים משויכים אליך מהיום והלאה.</div>`;
  return days.map(d=>`<div class="muted" style="font-weight:800;margin:12px 0 4px">${d}</div>`+by[d].map(e=>`<div class="card" data-instid="${e.r.id}" data-instkind="${e.kind}">

    </div>`).join("")).join("");
}

    b.onclick=()=>openProjectFiles(r, b.dataset.projurl, b.dataset.projname);
  });
}
async function openProjectFiles(r, url, name){
  const box=document.getElementById("filesMount");
  if(!box) return;
  if(!url) return toast("אין תיקיית פרויקט");
  box.innerHTML=filesBlockHtml([],{send:true, loading:true, title:"פרויקט · "+(name||""), back:true});
  const files=await loadFiles({folderUrl:url});
  if(!document.getElementById("filesMount")) return;
  box.innerHTML=filesBlockHtml(files,{send:true, title:"פרויקט · "+(name||""), back:true});
  bindFileBox(r, files);
  fillThumbs(files);
  const back=document.getElementById("filesBack");
  if(back) back.onclick=()=>reloadClientFiles(r);
}
function reloadClientFiles(r){
  const box=document.getElementById("filesMount");
  if(!box) return;
  box.innerHTML=filesBlockHtml([],{upload:true, send:true, loading:true});
  bindFiles(r,false);
  loadFiles(r).then(files=>{
    if(!document.getElementById("filesMount")) return;
    box.innerHTML=filesBlockHtml(files,{upload:true, send:true});
    bindFiles(r,false);
    bindFileBox(r, files);
    fillThumbs(files);
  });
}
async function syncProjects(r){
  if(!r||!r.folderUrl) return;
  try{
    const out=await runGS("apiListProjects",{folderUrl:r.folderUrl});
    if(out&&out.ok) r.projects=out.folders||[];
    else if(out&&out.error==="missing"){ r.folderUrl=""; r.projects=[]; }
  }catch(e){}
}

function hoursList(){
  const a=[];
  for(let h=8;h<=18;h++) a.push(String(h).padStart(2,"0")+":00");
  return a;
}

      </div>

      <div class="toolbar"><span class="chip" id="pPrev">‹</span><b>${esc(title)}</b><span class="chip" id="pNext">›</span></div>
      <div class="cal-wd-row" style="margin-top:6px">${wd}</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:4px 0" id="pDays">${days}</div>
      <label>שעה</label>
      <div id="pHours" style="display:flex;flex-wrap:wrap;gap:6px">${hours}</div>
      <label>מתקין</label>
      <select id="pWho">${instOptions("")}</select>

      </div>`;
    let day=now.getDate(), hour="09:00";
    document.getElementById("pPrev").onclick=()=>{m--; if(m<0){m=11;y--;} paint()};
    document.getElementById("pNext").onclick=()=>{m++; if(m>11){m=0;y++;} paint()};
    document.getElementById("pDays").onclick=e=>{
      const b=e.target.closest("[data-d]"); if(!b) return;
      day=+b.dataset.d;
      document.querySelectorAll("#pDays .chip").forEach(x=>x.classList.toggle("on",x===b));
    };
    document.getElementById("pHours").onclick=e=>{
      const b=e.target.closest("[data-h]"); if(!b) return;
      hour=b.dataset.h;
      document.querySelectorAll("#pHours .chip").forEach(x=>x.classList.toggle("on",x===b));
    };
    document.getElementById("pBack").onclick=()=>isNew?openNew(r):openCard(r.id);
    document.getElementById("pOk").onclick=()=>applyPick(r,kind,y,m,day,hour,val("pNote"),isNew);
  };
  paint();
}
async function applyPick(r,kind,y,m,day,hour,note,isNew){
  const g=id=>{const el=document.getElementById(id); return el?el.value.trim():"";};
  r.phone=g("f_phone")||r.phone; r.phone2=g("f_phone2")||r.phone2; r.contact=g("f_contact")||r.contact;
  r.address=g("f_address")||r.address; r.floor=g("f_floor")||r.floor; r.apt=g("f_apt")||r.apt;
  const stamp=String(day).padStart(2,"0")+"/"+String(m+1).padStart(2,"0")+"/"+y+" "+hour;
  const field=kind==="m"?"measure":"install";
  const noteF=kind==="m"?"noteM":"noteI";
  r[noteF]="";
  const whoEl=document.getElementById("pWho");
  const who=whoEl?whoEl.value.trim():"";
  r.updated=fmtDT(new Date());
  const pack=Object.assign({},r,{whoMeasure:who,whoInstall:who});
  const text=eventBody(pack, kind, note);
  const loc=eventLocation(r);
  try{
    const out=await runGS("apiCalUpsert",{
      kind:field, title:text, start:stamp, address:r.address||"",
      note:text, name:r.name||"", phone:r.phone||"", phone2:r.phone2||"",
      contact:r.contact||"", floor:r.floor||"", apt:r.apt||"",
      anno:note||"", forceNew:true,
      calId:state.settings.calMeasure||state.settings.calendarId||""
    });
    const eid=out&&out.eventId||"";
    if(r[field] && r[field]!==stamp){
      r.extraDates=r.extraDates||[];
      r.extraDates.push({kind:field,start:r[field],eid:kind==="m"?r.measureEid:r.installEid,note:""});
    }
    if(r[field]===stamp){
      r.extraDates=r.extraDates||[];
      r.extraDates.push({kind:field,start:stamp,eid,note:""});
    }else{
      r[field]=stamp;
      if(kind==="m") r.measureEid=eid; else r.installEid=eid;
    }
    if(kind==="m") r.whoMeasure=""; else r.whoInstall="";
    if(!eid) toast("יומן: "+((out&&out.error)||"לא נשמר"));
  }catch(e){
    r[field]=stamp;
    toast("שגיאת יומן: "+(e&&e.message||e));
  }
  if(!isNew) await saveLocal();
  if(isNew) openNew(r); else openCard(r.id);
  toast((kind==="m"?"מדידה ":"התקנה ")+stamp);
}
function val(id){return document.getElementById(id).value.trim()}
function fileToB64(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const s=String(fr.result||""); const i=s.indexOf(","); res(i>=0?s.slice(i+1):s);};
    fr.onerror=rej;
    fr.readAsDataURL(file);
  });
}
function openUpDb(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open("corianchic-upq",1);
    req.onupgradeneeded=()=>req.result.createObjectStore("q",{keyPath:"id"});
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function qPut(item){
  return openUpDb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("q","readwrite");
    t.objectStore("q").put(item);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error);
  }));
}
function qAll(){
  return openUpDb().then(db=>new Promise((res,rej)=>{
    const req=db.transaction("q","readonly").objectStore("q").getAll();
    req.onsuccess=()=>res(req.result||[]);
    req.onerror=()=>rej(req.error);
  }));
}
function qDel(id){
  return openUpDb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("q","readwrite");
    t.objectStore("q").delete(id);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error);
  }));
}
let qBusy=false;
async function shrinkPic(file){
  if(!file||!String(file.type||"").startsWith("image/")||file.size<900000) return file;
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const max=1600;
    let w=img.width,h=img.height;
    if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",0.82));
    if(!blob) return file;
    return new File([blob], (file.name||"photo").replace(/\.[^.]+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}
async function enqueueUploads(r, files){
  if(!files||!files.length) return;
  if(!r.folderUrl){
    if(!r.name) throw new Error("name");
    try{
      const out=await runGS("apiCreateClientFolder",{name:r.name, parent:state.settings.folderActive||state.settings.folderClients||""});
      if(out&&out.ok) r.folderUrl=out.folderUrl;
    }catch(e){}
  }
  if(!r.folderUrl) throw new Error("folder");
  let n=0;
  for(const raw of files){
    const f=await shrinkPic(raw);
    await qPut({
      id:Date.now()+"-"+Math.random().toString(36).slice(2,8),
      clientId:r.id||"",
      folderUrl:r.folderUrl,
      name:f.name||("photo-"+Date.now()+".jpg"),
      mime:f.type||"image/jpeg",
      blob:f
    });
    n++;
  }
  toast("בתור העלאה: "+n);
  pumpQueue();
}
async function pumpQueue(){
  if(qBusy) return;
  qBusy=true;
  try{
    while(true){
      const all=await qAll();
      if(!all.length) break;
      if(typeof navigator!=="undefined" && navigator.onLine===false){
        toast("אין רשת · ממתין · "+all.length);
        break;
      }
      const item=all[0];
      try{
        const data=await fileToB64(item.blob);
        const up=await runGS("apiUploadFile",{folderUrl:item.folderUrl, name:item.name, mime:item.mime, data},90000);
        if(!up||!up.ok) throw new Error((up&&up.error)||"upload");
        await qDel(item.id);
        const left=all.length-1;
        toast(left?("הועלה · נשארו "+left):"הכל הועלה");
        const row=state.rows.find(x=>x.id===item.clientId);
        const box=document.getElementById("filesMount");
        if(box&&row){
          const files=await loadFiles(row);
          box.innerHTML=filesBlockHtml(files,{inst:!!document.querySelector(".acts")});
          bindFileBox(row, files);
          bindFiles(row,false);
          fillThumbs(files);
        }
      }catch(e){
        toast("ניסיון חוזר · "+(all.length));
        await new Promise(ok=>setTimeout(ok,5000));
        if(typeof navigator!=="undefined" && navigator.onLine===false) break;
      }
    }
  }finally{ qBusy=false; }
}
window.addEventListener("online",()=>{ toast("הרשת חזרה"); pumpQueue(); });

let weekLock=0;
function weekStartOf(d){
  const x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate()-x.getDay());
  return x;
}
function shiftCal(dirWeeks, dirMonths){
  const now=Date.now();
  if(now-weekLock<1500) return;
  weekLock=now;
  const cur=state.calMonth instanceof Date?state.calMonth:new Date();
  const start=weekStartOf(cur);
  if(dirWeeks) state.calMonth=new Date(start.getFullYear(), start.getMonth(), start.getDate()+dirWeeks*7);
  else {
    const m=new Date(cur.getFullYear(), cur.getMonth()+(dirMonths||0), 1);
    state.calMonth=m;
  }
  state._gcalKey="";
  render();
}
function bindMain(){
  const q=document.getElementById("q");
  if(q) q.oninput=()=>{state.q=q.value; render()};
  const o=document.getElementById("togOrd"); if(o) o.onclick=()=>{state.showOrders=!state.showOrders; render()};
  const a=document.getElementById("togArch"); if(a) a.onclick=()=>{state.showArch=!state.showArch; render()};
  const n=document.getElementById("btnNew"); if(n) n.onclick=openNew;
  const jump=(el, dw, dm)=>{
    if(!el) return;
    el.onclick=null;
    el.onpointerdown=null;
    el.ontouchend=null;
    el.onclick=e=>{ e.preventDefault(); e.stopPropagation(); shiftCal(dw, dm); };
  };
  jump(document.getElementById("calPrev"), state.calMode==="week"?-1:0, -1);
  jump(document.getElementById("calNext"), state.calMode==="week"?1:0, 1);
  const pp=document.getElementById("prodPrev");
  if(pp) pp.onclick=e=>{ e.preventDefault(); e.stopPropagation(); shiftProd(-1); };
  const pn=document.getElementById("prodNext");
  if(pn) pn.onclick=e=>{ e.preventDefault(); e.stopPropagation(); shiftProd(1); };
  const cmb=document.getElementById("calMonthBtn");
  if(cmb) cmb.onclick=()=>{state.calMode="month"; state._gcalKey=""; render();};
  const cwb=document.getElementById("calWeekBtn");
  if(cwb) cwb.onclick=()=>{state.calMode="week"; state._gcalKey=""; render();};
  if(state.view==="cal"){ loadGcal(); bindCal(); }
  if(state.view==="prod"){ loadGcal(); }
  const ri=document.getElementById("reimport"); if(ri) ri.onclick=async()=>{await loadDrive(); render()};
  const pla=document.getElementById("pickLocalActive"); if(pla) pla.onclick=()=>pickLocalActiveFolder();
  const rs=document.getElementById("roleSel");

      state.worker="";

      if(pin!==String(state.roles.prodPin)) return toast("קוד שגוי");
      state.worker="";
    }else{
      const list=state.installers||[];
      const sel=document.getElementById("instSel");
      const p=asInst(list[sel?sel.value:0]);
      if(!p.name) return toast("הוסף מתקין בהגדרות");
      if(!p.pin || pin!==String(p.pin)) return toast("קוד שגוי");
      state.worker=p.name;
      localStorage.setItem("cc_worker",p.name);
    }
    state.role=role; localStorage.setItem("cc_role",role);
    state.view=role==="installer"?"inst":role==="prod"?"prod":"board";
    render();
  };
  const addP=(id,arr)=>{
    const v=val(id); if(!v) return;
    arr.push(v); document.getElementById(id).value="";
    saveLocal().then(()=>render());
  };
  const aa=document.getElementById("addAgent"); if(aa) aa.onclick=()=>addP("newAgent",state.agents);
  const ai=document.getElementById("addInst");
  if(ai) ai.onclick=()=>{
    const name=val("newInstName"), email=val("newInstMail"), pin=val("newInstPin");
    if(!name) return toast("שם חובה");
    if(!pin) return toast("קוד אישי חובה");
    state.installers.push({name,email,pin});
    saveLocal().then(()=>render());
  };
  const ap=document.getElementById("addProd"); if(ap) ap.onclick=()=>addP("newProd",state.production);
  document.querySelectorAll("[data-rm]").forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const k=el.dataset.rm, i=+el.dataset.i;
      const bag=k==="ag"?state.agents:k==="ins"?state.installers:state.production;
      bag.splice(i,1); saveLocal().then(()=>render());
    };
  });
  const ss=document.getElementById("saveSet");
  if(ss) ss.onclick=async()=>{
    if(val("p_off")) state.roles.officePin=val("p_off");
    state.settings=Object.assign({},state.settings,{
      folderActive:val("s_active"),
      folderFinish:val("s_finish"),
      calMeasure:val("s_cal"),
      calInstall:val("s_cal"),
      calendarId:val("s_cal"),
      installPlusDays:val("s_ndays")||"10"
    });
    await saveLocal(); toast("ההגדרות נשמרו ל-Drive");
  };
  document.querySelectorAll("[data-id]").forEach(el=>{
    el.addEventListener("click",e=>{if(e.target.closest("a,.act,.btn,.st-nav")) return; openCard(el.dataset.id)});
  });
  document.querySelectorAll("[data-prodid]").forEach(el=>{
    el.onclick=()=>{ const r=state.rows.find(x=>x.id===el.dataset.prodid); if(r) openProdStrip(r); };
  });
  document.querySelectorAll("[data-instid]").forEach(el=>{
    el.onclick=()=>{ const r=state.rows.find(x=>x.id===el.dataset.instid); if(r) openCardRO(r, el.dataset.instkind); };
  });
  document.querySelectorAll("[data-stfwd]").forEach(el=>{
    el.onclick=e=>{ e.stopPropagation(); stepStatus(el.dataset.stfwd, 1); };
  });
  document.querySelectorAll("[data-stback]").forEach(el=>{
    el.onclick=e=>{ e.stopPropagation(); stepStatus(el.dataset.stback, -1); };
  });
  document.querySelectorAll("[data-done]").forEach(el=>{
    el.onclick=async e=>{
      e.stopPropagation();
      if(!await ask("לסיים מדידה? הסטטוס יהפוך לשרטוט","כן","לא")) return;
      const r=state.rows.find(x=>x.id===el.dataset.done);
      if(r){
        r.status="שרטוט";
        r.whoMeasure=state.worker||r.whoMeasure||"";
        r.updated=fmtDT(new Date());
        await saveLocal(); render(); toast("עבר לשרטוט"+(r.whoMeasure?" · "+r.whoMeasure:""));
      }
    };
  });
  document.querySelectorAll("[data-instdone]").forEach(el=>{
    el.onclick=async e=>{
      e.stopPropagation();
      if(!await ask("לסיים התקנה?","כן","לא")) return;
      const r=state.rows.find(x=>x.id===el.dataset.instdone);
      if(r){
        r.status="הותקן/ גבייה";
        r.whoInstall=state.worker||r.whoInstall||"";
        r.updated=fmtDT(new Date());
        await saveLocal(); render(); toast("הותקן"+(r.whoInstall?" · "+r.whoInstall:""));
      }
    };
  });
}

function render(){
  if(!state.role){
    document.getElementById("navd").innerHTML="";
    document.getElementById("navm").innerHTML="";
    document.getElementById("sub").textContent="בחירת תפקיד";
    const tk0=document.getElementById("topKpi"); if(tk0) tk0.innerHTML="";
    document.getElementById("main").innerHTML=renderLogin();
    bindMain();
    return;
  }
  nav();
  const tk=document.getElementById("topKpi");
  if(tk) tk.innerHTML=(state.role==="office"||state.role==="prod")?counts(state.rows):"";
  const n=state.rows.length;
  const vis=visible(state.rows).length;
  document.getElementById("sub").textContent = `Drive · ${n} · ${state.role==="office"?"משרד":state.role==="installer"?("מתקין"+(state.worker?" · "+state.worker:"")):"ייצור"} · 1657`;
  if(state.view==="debt"){ state.view="board"; state.filterStatus=state.filterStatus||"debt"; }
  const allowed=viewsForRole().map(v=>v[0]);
  if(allowed.indexOf(state.view)<0) state.view=allowed[0]||"board";
  try{ localStorage.setItem("cc_view",state.view); }catch(e){}
  const main=document.getElementById("main");
  const phone=window.innerWidth<=800;
  main.className=(state.view==="board")?"":((state.view==="cal"||(state.view==="prod"&&!phone))?"cal-fill":"scroll-main");
  try{
    main.innerHTML = ({board:renderBoard,debt:renderDebt,cal:renderCal,prod:renderProd,inst:renderInst,set:renderSet}[state.view]||renderBoard)();
  }catch(err){
    main.innerHTML="<div class='card'><b>שגיאת מסך</b><p class='muted'>"+esc(String(err&&err.message||err))+"</p></div>";
  }
  bindMain();
  pumpQueue();
}

function fitKb(){
  const ov=document.getElementById("ov");
  const md=document.getElementById("md");
  if(!ov||!md||!ov.classList.contains("show")) return;
  const vv=window.visualViewport;
  const h=Math.round((vv&&vv.height)||window.innerHeight);
  const t=Math.round((vv&&vv.offsetTop)||0);
  ov.style.top=t+"px";
  ov.style.height=h+"px";
  ov.style.bottom="auto";
  md.style.height=(h-16)+"px";
  md.style.maxHeight=(h-16)+"px";
}
window.addEventListener("resize",fitKb);
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",fitKb);
  window.visualViewport.addEventListener("scroll",fitKb);
}
document.addEventListener("focusin",e=>{
  if(!e.target||!e.target.closest("#md")) return;
  setTimeout(fitKb,50);
  setTimeout(fitKb,300);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const box=document.getElementById("md");
  if(!box||!e.target||!box.contains(e.target)) return;
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="BUTTON"||e.target.tagName==="A") return;
  e.preventDefault();
  const list=[...box.querySelectorAll("input,select,textarea,button.btn")].filter(el=>!el.disabled&&el.type!=="hidden"&&el.offsetParent);
  const i=list.indexOf(e.target);
  if(i>=0&&i<list.length-1) list[i+1].focus();
});

render();
(async()=>{
  try{
    const ok=await loadLocal();
    try{ await loadLocalActive(); }catch(e){}
    if(ok) render();
    try{ await loadDrive(); render(); }
    catch(e){ if(!ok) document.getElementById("sub").textContent="שגיאה: "+e.message; else toast("עובד מהעותק המקומי"); }
  }catch(e){
    document.getElementById("sub").textContent="שגיאה: "+e.message;
  }
})();
</script>
